ata-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-marpit-scope-g4er3ZlI="" data-theme="selfheal" style="--theme:selfheal;">
<h1>The Self-Healing Web</h1>
<h3>Designing Resilient, Typo-Proof URLs</h3>
<p><strong>Dominic Hollis</strong><br />
<em>EuroPython 2026</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="selfheal" data-marpit-pagination="2" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/images/disappearing.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="2" data-paginate="true" data-theme="selfheal" data-marpit-pagination="2" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3>404: a dead end for everyone</h3>

<ul>
<li>Users hit a wall over a poorly formatted URL - a typo, wrong case, a missing word</li>
<li>Developers lose the visit: a bounce, a lost referral, a support ticket</li>
<li>The web forgives fuzzy input everywhere else (search boxes, autocomplete) - except the address bar</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section style="" data-marpit-advanced-background="pseudo" data-marpit-pagination="2" data-marpit-pagination-total="20"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="selfheal" data-marpit-pagination="3" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;">
<h3>Defining &quot;self-healing&quot;</h3>
<ul>
<li>Moving on from <strong>strict routing</strong> to a <strong>resilient, user-friendly</strong> one</li>
<li>The <strong>unique identifier</strong> (id / primary key / slug suffix) is the <em>source of truth</em></li>
<li>The <strong>human-readable</strong> portion (slug text, casing, word order) is allowed to be flexible - or even missing</li>
<li>Goal: resolve the user's <em>intent</em>, not just match a string</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-jtUMbDBu="" data-theme="selfheal" style="--theme:selfheal;">
<h2>Who is using self-healing URLs?</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="selfheal" data-marpit-pagination="5" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;">
<h3>You've probably used one already</h3>
<ul>
<li><code>github.com/user/renamed-repo</code> → old repo name still redirects to the new one</li>
<li><code>stackoverflow.com/questions/12345/anything-here</code> → the slug text is decorative, the id is truth</li>
<li><code>amazon.de/dp/B0FH23F6SB/something</code> → same pattern: the product id (after <code>/dp/</code>) is the truth, the rest is cosmetic</li>
<li>Wikipedia: case-insensitive first letter, redirects for common aliases/misspellings</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="selfheal" data-marpit-pagination="6" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;">
<h3>The resilience mindset</h3>
<ul>
<li>Old mindset: <strong>&quot;I can't find that&quot;</strong> → 404, dead end, blame the user</li>
<li>New mindset: <strong>&quot;I know what you meant - let me find and fix it for you&quot;</strong></li>
<li>A redirect costs one extra request; a lost user can cost a customer</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-v4wOwxQD="" data-paginate="true" data-theme="selfheal" data-marpit-pagination="7" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;">
<h3>What should (and shouldn't) be healed</h3>
<p><strong>Fair game:</strong> typos, casing, word order, missing slug words, renamed-but-tracked resources</p>
<p><strong>Off limits:</strong> auth-gated routes, destructive actions, admin paths - anywhere &quot;close enough&quot; is a security risk</p>
<ul>
<li>Healing is about <em>forgiveness</em>, not <em>guessing</em> your way somewhere you shouldn't be*</li>
</ul>
<p>&lt;small&gt;&lt;sup&gt;*&lt;/sup&gt;Unless you want to be hacked.&lt;/small&gt;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-yvcoAGq5="" data-theme="selfheal" style="--theme:selfheal;">
<h2>Techniques for implementing self-healing URLs</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="selfheal" data-marpit-pagination="9" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/images/brain-1.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="9" data-paginate="true" data-theme="selfheal" data-marpit-pagination="9" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3>Technique 1: Partial string matching</h3>

<ul>
<li>Cheapest first: exact match, then substring / <code>LIKE</code>-style matches</li>
<li><code>WHERE slug LIKE '%term%'</code> - fast, index-friendly, easy to reason about</li>
<li>Good for: missing or extra words, partial slugs, reordered fragments</li>
<li>Limit: doesn't help with genuine typos or misspellings</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section style="" data-marpit-advanced-background="pseudo" data-marpit-pagination="9" data-marpit-pagination-total="20"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="selfheal" data-marpit-pagination="10" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/images/brain-2.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="10" data-paginate="true" data-theme="selfheal" data-marpit-pagination="10" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3>Technique 2: Fuzzy matching</h3>

<ul>
<li>Handles typos &amp; near-misses that substring matching can't</li>
<li>Similarity scoring (e.g. Python's <code>difflib.SequenceMatcher</code>) between the requested path and known candidates</li>
<li>A configurable <strong>cutoff</strong> threshold decides &quot;close enough&quot; vs. &quot;not a match&quot;</li>
<li>Trade-off: more forgiving, but more expensive and more prone to false positives</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section style="" data-marpit-advanced-background="pseudo" data-marpit-pagination="10" data-marpit-pagination-total="20"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="selfheal" data-marpit-pagination="11" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/images/brain-3.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="11" data-paginate="true" data-theme="selfheal" data-marpit-pagination="11" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3>Technique 3: Hybrid, chained resolution</h3>

<p>Real apps need more than one trick - chain cheap-to-expensive strategies.</p>
<p>flask-selfheal's <code>DatabaseResolver</code> tries, in order:</p>
<ol>
<li>Exact match</li>
<li>SQL <code>LIKE</code> matching</li>
<li>Normalized matching (<code>0→o</code>, <code>1→l</code>, ...)</li>
<li>Word-based matching</li>
<li>Partial matching</li>
<li>Fuzzy matching <em>(last resort)</em></li>
</ol>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section style="" data-marpit-advanced-background="pseudo" data-marpit-pagination="11" data-marpit-pagination-total="20"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="selfheal" data-marpit-pagination="12" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;">
<h3>flask-selfheal, under the hood</h3>
<ul>
<li><code>SelfHeal(app, resolvers=[...])</code> - one Flask extension, a <em>list</em> of resolvers</li>
<li>Resolvers are <strong>chainable</strong> - each is tried in order until one resolves the path</li>
<li>Built-ins: <code>FlaskRoutesResolver</code>, <code>AliasMappingResolver</code>, <code>FuzzyMappingResolver</code>, <code>DatabaseResolver</code></li>
<li>Plug in only what you need; combine them for defense in depth</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="code" data-theme="selfheal" class="code" data-marpit-pagination="13" data-marpit-pagination-total="20" style="--paginate:true;--class:code;--theme:selfheal;">
<h3>Case study: fixing route typos</h3>
<pre><code class="language-python"><span class="hljs-keyword">from</span> flask_selfheal <span class="hljs-keyword">import</span> SelfHeal
<span class="hljs-keyword">from</span> flask_selfheal.resolvers <span class="hljs-keyword">import</span> FlaskRoutesResolver

<span class="hljs-meta">@app.route("/home")</span>
<span class="hljs-function"><span class="hljs-keyword">def</span> <span class="hljs-title">home</span><span class="hljs-params">()</span>:</span> ...

<span class="hljs-meta">@app.route("/about")</span>
<span class="hljs-function"><span class="hljs-keyword">def</span> <span class="hljs-title">about</span><span class="hljs-params">()</span>:</span> ...

SelfHeal(app, resolvers=[FlaskRoutesResolver()])
</code></pre>
<pre><code><span class="hljs-string">/hme</span>    --&gt;  <span class="hljs-string">/home</span>
<span class="hljs-string">/abot</span>   --&gt;  <span class="hljs-string">/about</span>
<span class="hljs-string">/contat</span> --&gt;  <span class="hljs-string">/contact</span>
</code></pre>
<p>Fuzzy-matches against your <em>already registered</em> Flask routes - zero extra config.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="code" data-theme="selfheal" class="code" data-marpit-pagination="14" data-marpit-pagination-total="20" style="--paginate:true;--class:code;--theme:selfheal;">
<h3>Case study: chaining resolvers</h3>
<pre><code class="language-python"><span class="hljs-keyword">from</span> flask_selfheal.resolvers <span class="hljs-keyword">import</span> AliasMappingResolver, FuzzyMappingResolver

resolvers = [
    AliasMappingResolver({<span class="hljs-string">"old-path"</span>: <span class="hljs-string">"new-path"</span>}),
    FuzzyMappingResolver([<span class="hljs-string">"home"</span>, <span class="hljs-string">"new-path"</span>]),
]
SelfHeal(app, resolvers=resolvers)
</code></pre>
<pre><code>/<span class="hljs-function"><span class="hljs-title">old</span>-<span class="hljs-built_in">path</span> --&gt;</span>  /new-<span class="hljs-built_in">path</span>   (alias)
/<span class="hljs-function"><span class="hljs-title">hme</span>      --&gt;</span>  /home       (fuzzy)
/<span class="hljs-function"><span class="hljs-title">new</span>-pth  --&gt;</span>  /new-<span class="hljs-built_in">path</span>   (fuzzy)
</code></pre>
<p>Explicit aliases for known renames; fuzzy matching as the safety net.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="code" data-theme="selfheal" class="code" data-marpit-pagination="15" data-marpit-pagination-total="20" style="--paginate:true;--class:code;--theme:selfheal;">
<h3>Case study: healing slugs against a database</h3>
<pre><code class="language-python"><span class="hljs-keyword">from</span> flask_selfheal.resolvers <span class="hljs-keyword">import</span> DatabaseResolver

resolver = DatabaseResolver(
    Articles,
    slug_field=<span class="hljs-string">"slug"</span>,
    fuzzy_cutoff=<span class="hljs-number">0.7</span>,
    enable_word_matching=<span class="hljs-literal">True</span>,
    enable_partial_matching=<span class="hljs-literal">True</span>,
    custom_normalizers={<span class="hljs-string">"0"</span>: <span class="hljs-string">"o"</span>, <span class="hljs-string">"ph"</span>: <span class="hljs-string">"f"</span>},
)
SelfHeal(app, resolvers=[resolver], redirect_pattern=<span class="hljs-string">"/articles/{slug}"</span>)
</code></pre>
<pre><code><span class="hljs-regexp">/articles/</span>hell-wrl  --&gt;  <span class="hljs-regexp">/articles/</span>hello-world-<span class="hljs-number">1234567</span>
</code></pre>
<p>Same tuning knobs that power the last three techniques, exposed as config.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-JPkrhssa="" data-theme="selfheal" style="--theme:selfheal;">
<h2>Live demo</h2>

<p>1: A typo in a URL segment<br />
2: A missing / reordered slug word<br />
3: Case sensitivity<br />
4: A database-backed slug, healed end-to-end</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="selfheal" data-marpit-pagination="17" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;">
<h3>What happens on a request?</h3>
&lt;div class="flow"&gt;
  &lt;div class="step miss"&gt;404 raised&lt;/div&gt;
  &lt;div class="arrow"&gt;→&lt;/div&gt;
  &lt;div class="step miss"&gt;Resolver 1: exact&lt;/div&gt;
  &lt;div class="arrow"&gt;→&lt;/div&gt;
  &lt;div class="step miss"&gt;Resolver 2: fuzzy&lt;/div&gt;
  &lt;div class="arrow"&gt;→&lt;/div&gt;
  &lt;div class="step"&gt;Resolver 3: DB match&lt;/div&gt;
&lt;/div&gt;
&lt;div class="flow"&gt;
  &lt;div class="arrow"&gt;match found&lt;/div&gt;
  &lt;div class="step"&gt;301 / 302 redirect&lt;/div&gt;
  &lt;div class="arrow"&gt;no match anywhere&lt;/div&gt;
  &lt;div class="step miss"&gt;real 404&lt;/div&gt;
&lt;/div&gt;
<p>Resolvers are tried in the order you configure them - first match wins.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="selfheal" data-marpit-pagination="18" data-marpit-pagination-total="20" style="--paginate:true;--theme:selfheal;">
<h3>Limitations &amp; trade-offs</h3>
<ul>
<li>Fuzzy matching can produce false positives - &quot;close enough&quot; isn't always &quot;correct&quot;</li>
<li>DB fallback strategies (word / partial / fuzzy) cost more than an indexed exact lookup</li>
<li>Redirect chains can confuse caching/SEO if not paired with proper 301s</li>
<li>Healing should never extend to security-sensitive or destructive routes</li>
</ul>
</section>

<h3>Recap</h3>
<ul>
<li>404s are a dead end - self-healing URLs turn them into a redirect</li>
<li>Treat the identifier as truth, keep the human-readable part flexible</li>
<li>Chain cheap → expensive resolution strategies (string match → fuzzy → DB)</li>
<li>flask-selfheal packages this up as composable resolvers for Flask</li>
</ul>
</section>
